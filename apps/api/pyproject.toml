[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/interview_api"]
